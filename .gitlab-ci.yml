variables:
  ORG: dgap
  APP_NAME: ppgoapibiometriafacialws
  IMAGE_TAG: $CI_REGISTRY/$ORG/$APP_NAME:$CI_COMMIT_SHORT_SHA
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - python
  - docker
  - homo
  - prod

python:
  image: python:3.12-slim
  stage: python
  script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

docker:
  image: docker:27
  stage: docker
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  script:
    - |
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready"
          break
        fi
        echo "Waiting for Docker daemon... ($i/30)"
        sleep 2
      done
      docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - branches
    - merge_requests
  except:
    - tags

homo:
  image: dtzar/helm-kubectl
  environment:
    name: homologacao
  stage: homo
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: manual
  script:
    - export KUBE_CONFIG="$KUBE_CONFIG_HOMO"
    - export QTD_REPLICAS=1
    - export QTD_MEMORIA=2Gi
    - export QTD_CPU=1
    - export APP_HOST="ppgobiometriafacialapi-homo.ssp.go.gov.br"
    - deploy

prod:
  image: dtzar/helm-kubectl
  environment:
    name: producao
  stage: prod
  when: manual
  only:
    - main
    - master
  script:
    - export KUBE_CONFIG="$KUBE_CONFIG_PROD"
    - export QTD_REPLICAS=1
    - export QTD_MEMORIA=4Gi
    - export QTD_CPU=2
    - export APP_HOST="ppgobiometriafacialapi.ssp.go.gov.br"
    - deploy

.functions: &functions |

  function deploy() {
    mkdir -p ~/.kube

    printf '%s' "$KUBE_CONFIG" > ~/.kube/config
    chmod 600 ~/.kube/config

    sed -e "s/{{COMMIT_ID}}/$CI_COMMIT_SHORT_SHA/g" \
        -e "s/{{JOB_ID}}/$CI_JOB_ID/g" \
        -e "s/{{QTD_REPLICAS}}/$QTD_REPLICAS/g" \
        -e "s/{{QTD_MEMORIA}}/$QTD_MEMORIA/g" \
        -e "s/{{QTD_CPU}}/$QTD_CPU/g" \
        -e "s/{{APP_HOST}}/$APP_HOST/g" \
        ./kube/all.yaml > all-temp.yaml

    echo "Manifesto Kubernetes que será aplicado:"
    cat all-temp.yaml

    if grep -q "{{" all-temp.yaml; then
      echo "ERRO: existem variáveis que não foram substituídas."
      exit 1
    fi

    kubectl apply -f all-temp.yaml

    kubectl rollout status \
      deployment/${APP_NAME}-deployment \
      --timeout=10m || (
        echo "Falha no rollout. Exibindo detalhes do Deployment e dos Pods."

        kubectl describe deployment/${APP_NAME}-deployment || true
        kubectl describe pod -l jobid="$CI_JOB_ID" || true
        kubectl logs \
          --tail=10000 \
          --all-containers=true \
          -l jobid="$CI_JOB_ID" || true

        exit 1
      )
  }

before_script:
  - *functions
